[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvif"
version = "0.1.0"
description = "Computer Vision Integrity Assurance Framework for Multi-Contributor Pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary / Government of India - MoD / DGIS" }
authors = [
    { name = "SIH 2026 Team", email = "team@sih2026.local" }
]
dependencies = [
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
cvif = "cvif.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
